name: Deploy Weather Radar app to GitHub Pages

# Publishes /app to GitHub Pages on every push to the feature branch.
# The NGI app (type: RemoteHigh) points at the Pages URL, so pushing here
# updates what the head unit loads — that's the "auto-update from GitHub".

on:
  push:
    branches:
      - claude/bolt-euv-firmware-unlock-5fxzrz
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source = GitHub Actions) via the API on first run,
          # so no manual repo setting is required.
          enablement: true

      - name: Upload app/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
